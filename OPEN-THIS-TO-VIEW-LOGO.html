<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perth Ute Centre Logo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a1a1a;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:32px;
  padding:40px 20px;
}
h1 { color:#ff6a00; font-size:14px; letter-spacing:4px; text-transform:uppercase; }
.previews { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; }
.panel { display:flex; flex-direction:column; align-items:center; gap:10px; }
.label { color:#666; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.box { border-radius:10px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
.white { background:#fff; }
.dark  { background:#111; border:1px solid #333; }
.box svg { width:340px; max-width:90vw; height:auto; display:block; }
.box.small svg { width:150px; }
.btns { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
button {
  padding:13px 26px;
  border:none;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform 0.15s;
}
button:hover { transform:translateY(-2px); }
.b1 { background:#ff6a00; color:#000; }
.b2 { background:#fff; color:#000; }
.b3 { background:#2d2d2d; color:#fff; border:1px solid #444; }
.b4 { background:linear-gradient(135deg,#555 25%,#333 25%,#333 50%,#555 50%,#555 75%,#333 75%); background-size:10px 10px; color:#fff; border:1px solid #666; }
.info { color:#555; font-size:11px; text-align:center; line-height:2; }
.info b { color:#888; }
canvas { display:none; }
</style>
</head>
<body>

<h1>Perth Ute Centre &mdash; Logo</h1>

<div class="previews">
  <div class="panel">
    <div class="label">On White</div>
    <div class="box white"><svg id="s1"></svg></div>
  </div>
  <div class="panel">
    <div class="label">On Dark</div>
    <div class="box dark"><svg id="s2"></svg></div>
  </div>
  <div class="panel">
    <div class="label">Sticker Size</div>
    <div class="box white small"><svg id="s3"></svg></div>
  </div>
</div>

<div class="btns">
  <button class="b1" onclick="dlSVG()">&#11015; Download SVG (Vector)</button>
  <button class="b2" onclick="dlPNG('white')">&#11015; PNG – White BG</button>
  <button class="b3" onclick="dlPNG('dark')">&#11015; PNG – Dark BG</button>
  <button class="b4" onclick="dlPNG('transparent')">&#11015; PNG – Transparent</button>
</div>

<div class="info">
  <b>SVG</b> = infinitely sharp at any size — best for stickers, print &amp; signage<br>
  <b>PNG</b> exports at 2400 &times; 1500 px (3&times; high resolution)
</div>

<canvas id="c"></canvas>

<script>
// ── INLINE SVG SOURCE ───────────────────────────────────────────────────────
const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>

    </filter>
    <filter id="textShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>

      <stop offset="100%" style="stop-color:#1a1a1a"/>

  <!-- Badge border -->
  <rect x="30" y="30" width="740" height="440" rx="18" ry="18" fill="#ff6a00"/>
  <rect x="36" y="36" width="728" height="428" rx="15" ry="15" fill="#111111"/>
  <rect x="44" y="44" width="712" height="412" rx="12" ry="12" fill="url(#badgeGrad)"/>

  <!-- Corner accents -->
  <rect x="44" y="44" width="60" height="6" rx="3" fill="#ff6a00"/>

  <rect x="696" y="44" width="60" height="6" rx="3" fill="#ff6a00"/>

  <!-- Hood -->
  <path d="M280 55 L520 55 L540 100 L260 100 Z" fill="#1e1e1e" stroke="#ff6a00" stroke-width="1.5"/>

  <!-- Front fascia -->
  <rect x="240" y="118" width="320" height="155" rx="6" fill="#1a1a1a" stroke="#ff6a00" stroke-width="2"/>

  <!-- Left headlight -->
  <path d="M242 120 L335 120 L340 170 L242 170 Z" fill="#0d0d0d" stroke="#ff6a00" stroke-width="1.5"/>
  <rect x="250" y="126" width="70" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <rect x="250" y="126" width="5" height="18" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="295" cy="151" rx="26" ry="14" fill="#1a1a1a" stroke="#666" stroke-width="1.5"/>
  <ellipse cx="295" cy="151" rx="20" ry="10" fill="#0a0a0a"/>

  <ellipse cx="290" cy="148" rx="4" ry="3" fill="#ffffff" opacity="0.7"/>

  <!-- Right headlight -->
  <path d="M465 120 L558 120 L558 170 L460 170 Z" fill="#0d0d0d" stroke="#ff6a00" stroke-width="1.5"/>
  <rect x="480" y="126" width="70" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <rect x="545" y="126" width="5" height="18" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="505" cy="151" rx="26" ry="14" fill="#1a1a1a" stroke="#666" stroke-width="1.5"/>
  <ellipse cx="505" cy="151" rx="20" ry="10" fill="#0a0a0a"/>
  <ellipse cx="505" cy="151" rx="14" ry="7" fill="#1e2a3a"/>

  <rect x="242" y="172" width="316" height="72" rx="4" fill="#111" stroke="#ff6a00" stroke-width="2"/>

  <rect x="248" y="217" width="304" height="9" rx="2" fill="#222"/>
  <rect x="248" y="230" width="304" height="9" rx="2" fill="#222"/>
  <rect x="349" y="174" width="3" height="68" rx="1" fill="#111"/>
  <rect x="448" y="174" width="3" height="68" rx="1" fill="#111"/>
  <rect x="298" y="174" width="2" height="68" rx="1" fill="#0d0d0d"/>
  <rect x="500" y="174" width="2" height="68" rx="1" fill="#0d0d0d"/>

  <!-- Mazda badge -->
  <path d="M375 204 C370 198 358 198 352 204 C358 207 366 207 375 204Z" fill="#c0c0c0"/>

  <!-- Bumper -->
  <path d="M232 248 L568 248 L575 275 L225 275 Z" fill="#141414" stroke="#ff6a00" stroke-width="1.5"/>
  <rect x="232" y="254" width="336" height="3" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="387" y="260" width="26" height="12" rx="3" fill="#0d0d0d" stroke="#444" stroke-width="1"/>
  <rect x="394" y="264" width="12" height="5" rx="2" fill="#333"/>

  <!-- Fog lights -->
  <rect x="245" y="252" width="50" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <ellipse cx="270" cy="262" rx="18" ry="7" fill="#0a0a0a"/>

  <rect x="505" y="252" width="50" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <ellipse cx="530" cy="262" rx="18" ry="7" fill="#0a0a0a"/>
  <ellipse cx="530" cy="262" rx="12" ry="4" fill="#1a1f2a"/>
  <ellipse cx="527" cy="260" rx="3" ry="2" fill="#ffffff" opacity="0.5"/>

  <!-- Wheels -->
  <path d="M192 285 Q192 340 240 340 L240 285" fill="#0d0d0d" stroke="#333" stroke-width="1.5"/>
  <path d="M608 285 Q608 340 560 340 L560 285" fill="#0d0d0d" stroke="#333" stroke-width="1.5"/>
  <path d="M195 285 Q192 345 240 342" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <path d="M605 285 Q608 345 560 342" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round"/>

  <!-- Divider stripe -->
  <rect x="44" y="290" width="712" height="5" rx="2" fill="url(#accentGrad)"/>

  <!-- PERTH UTE text -->
  <text x="400" y="360"
    font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
    font-size="94" font-weight="900" font-style="italic" text-anchor="middle"
    fill="url(#chromeGrad)" stroke="#000000" stroke-width="5"
    paint-order="stroke fill" filter="url(#textShadow)" letter-spacing="-2">PERTH UTE</text>

  <!-- Orange lines above CENTRE -->
  <rect x="110" y="365" width="580" height="5" rx="2.5" fill="url(#accentGrad)"/>
  <rect x="110" y="373" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="110" y="377" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>
  <rect x="560" y="373" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="590" y="377" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>

  <!-- CENTRE text -->
  <text x="400" y="424"
    font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
    font-size="72" font-weight="900" font-style="italic" text-anchor="middle"
    fill="url(#orangeGrad)" stroke="#000000" stroke-width="4"
    paint-order="stroke fill" filter="url(#textShadow)" letter-spacing="6">CENTRE</text>

  <!-- Orange lines below CENTRE -->
  <rect x="110" y="430" width="580" height="5" rx="2.5" fill="url(#accentGrad)"/>
  <rect x="110" y="438" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="110" y="442" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>
  <rect x="560" y="438" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="590" y="442" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>

  <!-- ONE STOP SHOP -->
  <rect x="270" y="448" width="260" height="32" rx="6" fill="#ff6a00"/>
  <rect x="272" y="450" width="256" height="28" rx="5" fill="url(#taglineGrad)"/>
  <text x="400" y="470"
    font-family="'Arial','Helvetica',sans-serif"
    font-size="16" font-weight="700" text-anchor="middle"
    fill="#ffffff" letter-spacing="3">ONE STOP SHOP</text>
</svg>`;

// ── Inject SVG into all preview elements ──────────────────────────────────
['s1','s2','s3'].forEach(id => {
  const el = document.getElementById(id);
  const parser = new DOMParser();
  const doc = parser.parseFromString(SVG, 'image/svg+xml');
  const svgNode = doc.documentElement;
  // Copy all children and attributes
  [...svgNode.attributes].forEach(a => el.setAttribute(a.name, a.value));
  el.innerHTML = svgNode.innerHTML;
});

// ── SVG download ──────────────────────────────────────────────────────────
function dlSVG() {
  const blob = new Blob([SVG], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'perth-ute-centre-logo.svg';
  a.click();
}

// ── PNG download ──────────────────────────────────────────────────────────
function dlPNG(bg) {
  const scale = 3;
  const W = 800, H = 500;
  const canvas = document.getElementById('c');
  canvas.width  = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  if (bg === 'white') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H); }
  if (bg === 'dark')  { ctx.fillStyle = '#111111'; ctx.fillRect(0,0,W,H); }

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, W, H);
    const a = document.createElement('a');
    const label = bg === 'white' ? 'white-bg' : bg === 'dark' ? 'dark-bg' : 'transparent';
    a.download = `perth-ute-centre-logo-${label}@3x.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  const blob = new Blob([SVG], {type:'image/svg+xml'});
  img.src = URL.createObjectURL(blob);
}
</script>
</body>
</html>
