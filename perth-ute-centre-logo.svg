<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Outer glow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Inner shadow for text -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <!-- Chrome gradient for main text -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#e8e8e8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b0b0b0;stop-opacity:1"/>
    </linearGradient>
    <!-- Orange gradient for CENTRE -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff6a00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#cc4d00;stop-opacity:1"/>
    </linearGradient>
    <!-- Badge body gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1"/>
    </linearGradient>
    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1"/>
    </linearGradient>
    <!-- Orange accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc4d00;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff6a00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#cc4d00;stop-opacity:1"/>
    </linearGradient>
    <!-- Tagline background -->
    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- ===== OUTER BADGE SHAPE ===== -->
  <!-- Main badge with orange border -->
  <rect x="30" y="30" width="740" height="440" rx="18" ry="18" fill="#ff6a00" />
  <rect x="36" y="36" width="728" height="428" rx="15" ry="15" fill="#111111" />
  <rect x="44" y="44" width="712" height="412" rx="12" ry="12" fill="url(#badgeGrad)" />

  <!-- Corner accent marks -->
  <rect x="44" y="44" width="60" height="6" rx="3" fill="#ff6a00"/>
  <rect x="44" y="44" width="6" height="60" rx="3" fill="#ff6a00"/>
  <rect x="696" y="44" width="60" height="6" rx="3" fill="#ff6a00"/>
  <rect x="750" y="44" width="6" height="60" rx="3" fill="#ff6a00"/>
  <rect x="44" y="450" width="60" height="6" rx="3" fill="#ff6a00"/>
  <rect x="44" y="396" width="6" height="60" rx="3" fill="#ff6a00"/>
  <rect x="696" y="450" width="60" height="6" rx="3" fill="#ff6a00"/>
  <rect x="750" y="396" width="6" height="60" rx="3" fill="#ff6a00"/>

  <!-- ===== BT-50 FRONT FACE ===== -->
  <!-- Hood / Top of vehicle -->
  <path d="M280 55 L520 55 L540 100 L260 100 Z" fill="#1e1e1e" stroke="#ff6a00" stroke-width="1.5"/>

  <!-- Windshield lower frame -->
  <path d="M268 98 L532 98 L548 120 L252 120 Z" fill="#151515" stroke="#333" stroke-width="1"/>

  <!-- Main front fascia body -->
  <rect x="240" y="118" width="320" height="155" rx="6" ry="6" fill="#1a1a1a" stroke="#ff6a00" stroke-width="2"/>

  <!-- === HEADLIGHT UNITS (BT-50 style split) === -->
  <!-- Left headlight housing -->
  <path d="M242 120 L335 120 L340 170 L242 170 Z" fill="#0d0d0d" stroke="#ff6a00" stroke-width="1.5" rx="4"/>
  <!-- Right headlight housing -->
  <path d="M465 120 L558 120 L558 170 L460 170 Z" fill="#0d0d0d" stroke="#ff6a00" stroke-width="1.5" rx="4"/>

  <!-- Left DRL - signature L-shape -->
  <rect x="250" y="126" width="70" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <rect x="250" y="126" width="5" height="18" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Left headlight projection lens -->
  <ellipse cx="295" cy="151" rx="26" ry="14" fill="#1a1a1a" stroke="#666" stroke-width="1.5"/>
  <ellipse cx="295" cy="151" rx="20" ry="10" fill="#0a0a0a"/>
  <ellipse cx="295" cy="151" rx="14" ry="7" fill="#1e2a3a"/>
  <ellipse cx="290" cy="148" rx="4" ry="3" fill="#ffffff" opacity="0.7"/>

  <!-- Right DRL - signature L-shape (mirrored) -->
  <rect x="480" y="126" width="70" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <rect x="545" y="126" width="5" height="18" rx="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Right headlight projection lens -->
  <ellipse cx="505" cy="151" rx="26" ry="14" fill="#1a1a1a" stroke="#666" stroke-width="1.5"/>
  <ellipse cx="505" cy="151" rx="20" ry="10" fill="#0a0a0a"/>
  <ellipse cx="505" cy="151" rx="14" ry="7" fill="#1e2a3a"/>
  <ellipse cx="510" cy="148" rx="4" ry="3" fill="#ffffff" opacity="0.7"/>

  <!-- === CENTRE GRILLE (BT-50 wide bar style) === -->
  <rect x="242" y="172" width="316" height="72" rx="4" ry="4" fill="#111" stroke="#ff6a00" stroke-width="2"/>
  <!-- Grille bars horizontal -->
  <rect x="248" y="178" width="304" height="9" rx="2" fill="#222"/>
  <rect x="248" y="191" width="304" height="9" rx="2" fill="#222"/>
  <rect x="248" y="204" width="304" height="9" rx="2" fill="#222"/>
  <rect x="248" y="217" width="304" height="9" rx="2" fill="#222"/>
  <rect x="248" y="230" width="304" height="9" rx="2" fill="#222"/>
  <!-- Grille vertical dividers -->
  <rect x="349" y="174" width="3" height="68" rx="1" fill="#111"/>
  <rect x="448" y="174" width="3" height="68" rx="1" fill="#111"/>
  <rect x="298" y="174" width="2" height="68" rx="1" fill="#0d0d0d"/>
  <rect x="500" y="174" width="2" height="68" rx="1" fill="#0d0d0d"/>

  <!-- Mazda Wing badge on grille -->
  <!-- Left wing -->
  <path d="M375 204 C370 198 358 198 352 204 C358 207 366 207 375 204Z" fill="#c0c0c0"/>
  <path d="M375 204 C370 210 358 210 352 204 C358 201 366 201 375 204Z" fill="#a0a0a0"/>
  <!-- Right wing -->
  <path d="M425 204 C430 198 442 198 448 204 C442 207 434 207 425 204Z" fill="#c0c0c0"/>
  <path d="M425 204 C430 210 442 210 448 204 C442 201 434 201 425 204Z" fill="#a0a0a0"/>
  <!-- Centre M -->
  <path d="M390 198 L395 208 L400 201 L405 208 L410 198" fill="none" stroke="#c0c0c0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- === FRONT BUMPER / LOWER FASCIA === -->
  <path d="M232 248 L568 248 L575 275 L225 275 Z" fill="#141414" stroke="#ff6a00" stroke-width="1.5"/>
  <!-- Bumper accent line -->
  <rect x="232" y="254" width="336" height="3" rx="1.5" fill="#ff6a00" opacity="0.6"/>

  <!-- Tow hook -->
  <rect x="387" y="260" width="26" height="12" rx="3" fill="#0d0d0d" stroke="#444" stroke-width="1"/>
  <rect x="394" y="264" width="12" height="5" rx="2" fill="#333"/>

  <!-- Fog light left -->
  <rect x="245" y="252" width="50" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <ellipse cx="270" cy="262" rx="18" ry="7" fill="#0a0a0a"/>
  <ellipse cx="270" cy="262" rx="12" ry="4" fill="#1a1f2a"/>
  <ellipse cx="267" cy="260" rx="3" ry="2" fill="#ffffff" opacity="0.5"/>
  <!-- Fog light right -->
  <rect x="505" y="252" width="50" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <ellipse cx="530" cy="262" rx="18" ry="7" fill="#0a0a0a"/>
  <ellipse cx="530" cy="262" rx="12" ry="4" fill="#1a1f2a"/>
  <ellipse cx="527" cy="260" rx="3" ry="2" fill="#ffffff" opacity="0.5"/>

  <!-- Wheels suggestion (partial arcs) -->
  <path d="M192 285 Q192 340 240 340 L240 285" fill="#0d0d0d" stroke="#333" stroke-width="1.5"/>
  <path d="M608 285 Q608 340 560 340 L560 285" fill="#0d0d0d" stroke="#333" stroke-width="1.5"/>
  <!-- Tyre arcs -->
  <path d="M195 285 Q192 345 240 342" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <path d="M605 285 Q608 345 560 342" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round"/>

  <!-- ===== ORANGE ACCENT STRIPE BELOW TRUCK ===== -->
  <rect x="44" y="290" width="712" height="5" rx="2" fill="url(#accentGrad)"/>

  <!-- ===== TEXT SECTION ===== -->
  <!-- PERTH UTE text block -->
  <text x="400" y="360"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="94"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#chromeGrad)"
    stroke="#000000"
    stroke-width="5"
    paint-order="stroke fill"
    filter="url(#textShadow)"
    letter-spacing="-2">PERTH UTE</text>

  <!-- Orange stripe line above CENTRE -->
  <rect x="110" y="365" width="580" height="5" rx="2.5" fill="url(#accentGrad)"/>
  <!-- Triple lines left -->
  <rect x="110" y="373" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="110" y="377" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>
  <!-- Triple lines right -->
  <rect x="560" y="373" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="590" y="377" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>

  <!-- CENTRE text -->
  <text x="400" y="424"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="72"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#orangeGrad)"
    stroke="#000000"
    stroke-width="4"
    paint-order="stroke fill"
    filter="url(#textShadow)"
    letter-spacing="6">CENTRE</text>

  <!-- Bottom orange stripe line below CENTRE -->
  <rect x="110" y="430" width="580" height="5" rx="2.5" fill="url(#accentGrad)"/>
  <!-- Triple lines left -->
  <rect x="110" y="438" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="110" y="442" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>
  <!-- Triple lines right -->
  <rect x="560" y="438" width="130" height="2.5" rx="1.5" fill="#ff6a00" opacity="0.6"/>
  <rect x="590" y="442" width="100" height="2" rx="1" fill="#ff6a00" opacity="0.35"/>

  <!-- ONE STOP SHOP tagline pill -->
  <rect x="270" y="448" width="260" height="32" rx="6" ry="6" fill="#ff6a00"/>
  <rect x="272" y="450" width="256" height="28" rx="5" ry="5" fill="url(#taglineGrad)"/>
  <text x="400" y="470"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="16"
    font-weight="700"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="3">ONE STOP SHOP</text>

</svg>
